apiVersion: apps/v1
kind: Deployment
metadata:
  name: hlfa-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hlfa-frontend
  template:
    metadata:
      labels:
        app: hlfa-frontend
    spec:
      containers:
      - name: hlfa-frontend
        image: ghcr.io/makarivmri12/hlfa-frontend:latest
        ports:
        - containerPort: 3000
        env:
        - name: VITE_API_URL
          value: "https://api.hlfa.example.com"
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: hlfa-frontend
spec:
  selector:
    app: hlfa-frontend
  ports:
  - protocol: TCP
    port: 80
    targetPort: 3000
  type: LoadBalancer
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hlfa-ingress
spec:
  ingressClassName: nginx
  rules:
  - host: hlfa.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: hlfa-frontend
            port:
              number: 80
  - host: api.hlfa.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: hlfa-backend
            port:
              number: 8080
