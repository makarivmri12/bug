version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: hlfa
      POSTGRES_PASSWORD: hlfa
      POSTGRES_DB: hlfa
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hlfa"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5-enterprise
    environment:
      NEO4J_AUTH: neo4j/neo4j
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    ports:
      - "7687:7687"
      - "7474:7474"
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "neo4j", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    environment:
      DATABASE_DSN: "postgres://hlfa:hlfa@postgres:5432/hlfa"
      REDIS_ADDR: "redis:6379"
      NEO4J_URI: "bolt://neo4j:7687"
      NEO4J_USERNAME: "neo4j"
      NEO4J_PASSWORD: "neo4j"
      PYTHON_ENGINE_HOST: "python-engine"
      PYTHON_ENGINE_PORT: "5000"
    ports:
      - "8080:8080"
    volumes:
      - ./cmd:/app/cmd
      - ./internal:/app/internal
      - ./pkg:/app/pkg
    command: go run ./cmd/hlfa-server/main.go

  python-engine:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.python
    depends_on:
      - redis
    environment:
      REDIS_URL: "redis://redis:6379"
    ports:
      - "5000:5000"
    volumes:
      - ./python:/app/python
    command: uvicorn api.main:app --host 0.0.0.0 --port 5000 --reload

  frontend:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.frontend
    depends_on:
      - backend
    environment:
      VITE_API_URL: "http://localhost:8080"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src
      - /app/node_modules
    command: npm run dev

volumes:
  postgres_data:
  redis_data:
  neo4j_data:
  neo4j_logs:
